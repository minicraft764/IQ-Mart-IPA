name: IQ Mart

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 Build IQ Mart Physical iPhone IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Unsigned IPA for Physical Hardware
        run: flutter build ipa --release --no-codesign

      - name: Move and Rename IPA Artifact
        run: |
          mkdir -p final_ipa
          cp build/ios/ipa/*.ipa final_ipa/IQ-Mart.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IQ-Mart-IPA
          path: final_ipa/IQ-Mart.ipa
